name: Deploy to GitHub Pages

# The site is plain static files at the repo root, so there is nothing to build —
# this uploads the repo as-is and hands it to Pages.
on:
  push:
    branches:
      - main
      - claude/biobuzz-ftc-scoring-app-w6rx9f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on for the repo if it is not already, so no
        # manual trip to Settings -> Pages is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
